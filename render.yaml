services:
  - type: web
    name: anxin-yongdian
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install pillow"
    startCommand: "python app.py"
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false          # 在 Render 控制台手动填，不写进仓库
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    autoDeploy: true
